<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGH Campus Health Fest</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="fonts/itc-avant-garde.otf" as="font" type="font/otf" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link rel="preload" href="wavy lines.png" as="image">
    <link rel="preload" href="Health Fest Logo.png" as="image">
</head>

<body>

    <header class="site-header">
        <img src="logo.png" alt="Logo" class="header-logo">
        <div class="header-taglines">
            <p class="header-tagline">
                You are part of shaping the
                <span class="no-break">EGH Campus Smart Hospital.</span>
            </p>
            <p class="header-tagline">Join us to unveil our vision for the roadmap.
            </p>
        </div>
    </header>

    <div class="button-wrapper">
        <button id="mainBtn" class="my-button">
            <img src="button_rectangle_depth_flat.png" alt="Button">
            <span class="button-label">I'M READY</span>
        </button>
    </div>

    <script src="script.js"></script>
</body>

</html>
